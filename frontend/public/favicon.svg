<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Beatster vinyl favicon: bold shapes only — fine grooves vanish at 16px -->
  <defs>
    <linearGradient id="lbl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffab4a"/>
      <stop offset="1" stop-color="#ff3d8f"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#17151f"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ff3d8f" stroke-width="2.4" opacity="0.9"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#5c5a75" stroke-width="1.8" stroke-dasharray="26 10"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#484660" stroke-width="1.6" stroke-dasharray="14 8"/>
  <circle cx="32" cy="6.5" r="2.2" fill="#3fc7ff"/>
  <circle cx="32" cy="32" r="12" fill="url(#lbl)"/>
  <circle cx="32" cy="32" r="3.2" fill="#17151f"/>
</svg>
